<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYPHRX :: cyber ops terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#050505;--bg-1:#080808;--bg-2:#0a0a0a;--bg-3:#111111;
  --panel:#0b0b0b;--panel-2:#0d0d0d;--panel-3:#131313;
  --border:#1d1d1d;--border-2:#2a2a2a;--border-hot:#3a3a3a;
  --red:#ff003c;--red-dim:#cc0030;--red-glow:rgba(255,0,60,.45);
  --green:#00ff88;--green-dim:#00cc6e;--green-glow:rgba(0,255,136,.35);
  --yellow:#ffcc00;--yellow-glow:rgba(255,204,0,.4);
  --cyan:var(--green);--cyan-dim:var(--green-dim);--cyan-glow:var(--green-glow);
  --crimson:var(--red);--crimson-glow:var(--red-glow);--blood:#aa0028;
  --emerald:var(--green);--emerald-glow:var(--green-glow);--amber:var(--yellow);
  --violet:var(--green);--violet-dim:var(--green-dim);--violet-glow:var(--green-glow);
  --rose:var(--red);--pink:var(--red);
  --text:#f5f5f5;--text-2:#cccccc;--text-dim:#888888;--text-muted:#555555;
  --ui:'JetBrains Mono','Share Tech Mono','Menlo','Consolas',monospace;
  --mono:'JetBrains Mono','Share Tech Mono','Menlo','Consolas',monospace;
  --display:'Orbitron','JetBrains Mono',monospace;
  --r-sm:2px;--r-md:4px;--r-lg:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0);color:var(--text);font-family:var(--ui);font-size:13.5px;line-height:1.5;overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);opacity:.5}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 40% at 50% 0%,rgba(255,0,60,.06),transparent 70%),radial-gradient(ellipse 60% 30% at 50% 100%,rgba(0,255,136,.03),transparent 70%)}
.app{display:grid;grid-template-columns:232px 1fr 300px;grid-template-rows:56px 1fr;min-height:100vh;position:relative;z-index:1}
.topbar{grid-column:1/-1;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);border-top:2px solid #0a0a0a;display:flex;align-items:center;padding:0 18px;gap:16px;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;user-select:none}
.brand-mark{width:24px;height:24px;background:var(--red);transform:rotate(45deg);position:relative;box-shadow:0 0 14px var(--red-glow);border-radius:1px}
.brand-mark::before{content:'';position:absolute;inset:3px;background:var(--bg-0);border-radius:1px}
.brand-mark::after{content:'';position:absolute;inset:7px;background:var(--red);border-radius:1px}
.brand-name{font-family:var(--display);font-size:16px;font-weight:900;letter-spacing:.22em;color:var(--text);text-shadow:0 0 6px rgba(255,0,60,.4)}
.brand-name .v{color:var(--text-muted);font-weight:500;margin-left:8px;font-size:9px;letter-spacing:.12em;font-family:var(--mono)}
.topbar-status{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:11px;font-family:var(--mono);letter-spacing:.08em}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald-glow);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.status-auth{color:var(--crimson);font-weight:700;letter-spacing:.12em;padding:2px 8px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);border-radius:4px;font-size:10px}
.topbar-search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--border);padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
.topbar-search:hover{border-color:var(--border-hot);background:var(--bg-3)}
.topbar-search-icon{color:var(--cyan);font-weight:700;font-size:14px}
.topbar-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--ui);font-size:13px;outline:none;pointer-events:none}
.topbar-search input::placeholder{color:var(--text-muted)}
.kbd{padding:2px 7px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:4px;font-size:10px;color:var(--text-2);font-family:var(--mono);letter-spacing:.05em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.meta-block{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.meta-label{font-size:9px;color:var(--text-muted);letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.meta-val{font-family:var(--mono);font-size:13px;color:var(--cyan);font-weight:600}
.meta-val.amb{color:var(--amber)}
.icon-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;font-family:var(--ui);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;border-radius:var(--r-md);transition:all .15s}
.icon-btn:hover{color:var(--cyan);border-color:var(--border-hot);background:var(--bg-3)}
.icon-btn:focus-visible{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,255,136,.18);color:var(--cyan)}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto;height:calc(100vh - 56px);position:sticky;top:56px}
.nav-group{padding:0 10px;margin-bottom:16px}
.nav-group-title{font-size:9px;color:var(--crimson);letter-spacing:.18em;padding:4px 12px 8px;margin-bottom:4px;font-weight:800;text-transform:uppercase;border-bottom:1px solid rgba(220,38,38,.2)}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 12px;color:var(--text-dim);cursor:pointer;font-size:12.5px;border-left:2px solid transparent;border-radius:0 6px 6px 0;user-select:none;transition:all .12s;margin-bottom:1px}
.nav-item:hover{color:var(--text);background:rgba(0,255,136,.06)}
.nav-item.active{color:var(--cyan);background:linear-gradient(90deg,rgba(0,255,136,.12),transparent);border-left-color:var(--cyan);font-weight:600}
.nav-item.hot.active{color:var(--red);background:linear-gradient(90deg,rgba(255,0,60,.12),transparent);border-left-color:var(--red)}
.nav-icon{width:16px;font-size:13px;flex-shrink:0}
.nav-name{flex:1}
.nav-count{font-family:var(--mono);font-size:10px;color:var(--text-muted);background:var(--bg-2);padding:1px 6px;border:1px solid var(--border);border-radius:3px}
.nav-item.active .nav-count{color:var(--cyan);border-color:var(--cyan-dim);background:rgba(0,255,136,.08)}
.workspace{padding:24px 28px;overflow-x:hidden;max-width:100%}
.ws-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:22px;gap:18px;flex-wrap:wrap}
.ws-title{display:flex;align-items:center;gap:14px}
.ws-title-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--border);border-radius:8px}
.ws-title-text{font-size:22px;font-weight:700;color:var(--text)}
.ws-count{font-size:12px;color:var(--text-dim);margin-top:2px;font-family:var(--mono)}
.ws-count strong{color:var(--cyan);font-weight:700}
.ws-filter input{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-family:var(--ui);font-size:12px;outline:none;width:240px;border-radius:8px;transition:all .15s}
.ws-filter input:focus{border-color:var(--cyan-dim);box-shadow:0 0 0 3px rgba(0,255,136,.12)}
.ws-filter input::placeholder{color:var(--text-muted)}
.cmd-list{display:flex;flex-direction:column;gap:12px}
.cmd{background:var(--panel);border:1px solid var(--border);border-left:3px solid transparent;border-radius:8px;position:relative;transition:border-color .15s,box-shadow .15s;overflow:hidden}
.cmd:hover{border-color:var(--border-hot);border-left-color:var(--border-hot)}
.cmd-bar{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;background:var(--panel-2)}
.cmd-num{font-family:var(--mono);font-size:10px;color:var(--text-muted);width:28px}
.cmd-title{font-size:13.5px;color:var(--text);font-weight:600;flex:1}
.cmd-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:.1em;border:1px solid;border-radius:3px;font-weight:600;text-transform:uppercase}
.tag.high{background:rgba(245,158,11,.1);color:var(--amber);border-color:rgba(245,158,11,.4)}
.tag.crit{background:rgba(244,63,94,.1);color:var(--rose);border-color:rgba(244,63,94,.4)}
.tag.new{background:rgba(0,255,136,.1);color:var(--cyan);border-color:rgba(0,255,136,.4)}
.tag.opsec{background:rgba(167,139,250,.1);color:var(--violet);border-color:rgba(167,139,250,.4)}
.cmd-code{padding:14px 16px;position:relative}
.cmd-code pre{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.cmd-code .cmt{color:var(--text-muted);font-style:italic}
.cmd-code .var{color:var(--violet);font-weight:600;background:rgba(167,139,250,.1);padding:1px 4px;border-radius:3px;border:1px solid rgba(167,139,250,.2)}
.cmd-code .kw{color:var(--cyan);font-weight:500}
.cmd-code .str{color:var(--emerald)}
.cmd-code .num{color:var(--amber)}
.cmd-actions{position:absolute;top:11px;right:12px;display:flex;gap:5px;opacity:.45;transition:opacity .15s}
.cmd:hover .cmd-actions,.cmd:focus-within .cmd-actions{opacity:1}
.act-btn{background:var(--bg-3);border:1px solid var(--border-2);color:var(--text-2);padding:4px 10px;font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.06em;cursor:pointer;border-radius:var(--r-sm);text-transform:uppercase;transition:all .12s}
.act-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);background:rgba(0,255,136,.08)}
.act-btn.done{color:var(--emerald);border-color:var(--emerald);background:rgba(16,185,129,.08)}
.cmd.checked{border-left-color:var(--emerald);background:linear-gradient(90deg,rgba(16,185,129,.04),var(--panel) 40%)}
.cmd.checked .cmd-title{color:var(--emerald)}
.vars{background:var(--panel);border-left:1px solid var(--border);padding:18px 16px;height:calc(100vh - 56px);position:sticky;top:56px;overflow-y:auto}
.vars-head{font-size:10px;color:var(--text-dim);letter-spacing:.22em;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.vars-head::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.var-row{margin-bottom:11px}
.var-row label{display:block;font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:.12em;margin-bottom:4px;font-weight:600;text-transform:uppercase}
.var-row input{width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-family:var(--mono);font-size:12px;outline:none;border-radius:var(--r-md);transition:all .15s}
.var-row input:focus{border-color:var(--cyan-dim);box-shadow:0 0 0 2px rgba(0,255,136,.15);color:var(--cyan)}
.var-row input::placeholder{color:var(--text-muted);font-size:11px}
.vars-hint{font-size:11px;color:var(--text-muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--border);line-height:1.6}
.vars-hint code{color:var(--violet);background:rgba(167,139,250,.08);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:10.5px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hot)}
.sec-band{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--crimson);text-transform:uppercase;font-weight:700;padding:8px 12px;border-left:2px solid var(--crimson);background:rgba(220,38,38,.04);margin:26px 0 14px}
/* dashboard tiles */
.term{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);margin-bottom:22px;overflow:hidden;box-shadow:0 0 0 1px rgba(220,38,38,.12),0 12px 32px rgba(0,0,0,.4)}
.term-bar{background:var(--bg-2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:14px;font-family:var(--mono)}
.term-dots{display:flex;gap:6px}
.term-dots i{width:11px;height:11px;border-radius:50%;background:var(--bg-3);border:1px solid var(--border-2);display:inline-block}
.term-dots i:nth-child(1){background:#ff5f57;border-color:#e0443e}
.term-dots i:nth-child(2){background:#febc2e;border-color:#d49d28}
.term-dots i:nth-child(3){background:#28c840;border-color:#1ea133}
.term-title{flex:1;text-align:center;font-size:11px;color:var(--text-dim);letter-spacing:.08em}
.term-meta{font-family:var(--mono);font-size:10px;color:var(--crimson);letter-spacing:.15em;font-weight:700;padding:2px 8px;border:1px solid rgba(220,38,38,.3);border-radius:var(--r-sm)}
.term-body{padding:24px 22px 22px}
.term-welcome{text-align:center;margin-bottom:22px}
.tw-line{font-family:var(--mono);font-size:10px;letter-spacing:.35em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.tw-brand{font-family:var(--display);font-size:56px;font-weight:900;letter-spacing:.15em;color:var(--text);margin-bottom:8px;position:relative;display:inline-block;text-shadow:0 0 4px rgba(255,255,255,.4),0 0 18px rgba(255,0,60,.5)}
.tw-brand .accent{color:var(--red);text-shadow:0 0 12px var(--red-glow)}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;pointer-events:none}
.glitch::before{color:var(--red);transform:translate(-2px,0);opacity:.6;mix-blend-mode:screen;animation:glitch-l 2.4s infinite steps(2,end)}
.glitch::after{color:var(--green);transform:translate(2px,0);opacity:.55;mix-blend-mode:screen;animation:glitch-r 2.8s infinite steps(2,end)}
@keyframes glitch-l{0%,96%,100%{transform:translate(-2px,0)}97%{transform:translate(-4px,1px)}98%{transform:translate(0,-1px)}}
@keyframes glitch-r{0%,94%,100%{transform:translate(2px,0)}95%{transform:translate(4px,-1px)}96%{transform:translate(0,1px)}}
.tw-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin-bottom:18px}
.tile{background:var(--bg-2);padding:22px 16px;text-align:center;transition:background .2s;cursor:pointer}
.tile:hover{background:var(--bg-3)}
.tile-v{font-family:var(--display);font-size:34px;font-weight:900;color:var(--red);line-height:1;text-shadow:0 0 14px var(--red-glow)}
.tile-v.em{color:var(--green);text-shadow:0 0 14px var(--green-glow)}
.tile-v.am{color:var(--yellow);text-shadow:0 0 14px var(--yellow-glow)}
.tile-sub{font-size:16px;color:var(--text-muted);font-weight:500}
.tile-l{font-family:var(--mono);font-size:9px;color:var(--text-dim);letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:12px}
.dash-cat{background:var(--panel);border:1px solid var(--border);padding:14px 16px 12px;cursor:pointer;transition:all .2s;position:relative;border-radius:var(--r-md)}
.dash-cat:hover{border-color:var(--red);background:rgba(255,0,60,.03);box-shadow:0 0 18px rgba(255,0,60,.25)}
.dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dc-icon{font-size:20px}
.dc-chip{font-family:var(--mono);font-size:9px;letter-spacing:.18em;font-weight:700;padding:2px 7px;border-radius:var(--r-sm);border:1px solid}
.dc-chip.tool{color:var(--green);border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.06)}
.dc-chip.core{color:var(--text-dim);border-color:var(--border-2);background:var(--bg-2)}
.dc-chip.adv{color:var(--red);border-color:rgba(255,0,60,.4);background:rgba(255,0,60,.06)}
.dc-chip.new{color:var(--yellow);border-color:rgba(255,204,0,.4);background:rgba(255,204,0,.06)}
.dc-name{font-family:var(--display);font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:.04em}
.dc-desc{color:var(--text-dim);font-size:11.5px;line-height:1.5;margin-bottom:12px;min-height:34px;font-family:var(--mono)}
.dc-foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding-top:8px;border-top:1px solid var(--border)}
.dc-count{color:var(--red);font-weight:700}
.dc-arrow{color:var(--text-dim);transition:all .15s}
.dash-cat:hover .dc-arrow{color:var(--red);transform:translateX(3px)}
.sec-h{font-size:10.5px;color:var(--text-dim);letter-spacing:.22em;margin:22px 0 10px;display:flex;align-items:center;gap:10px;font-weight:700;text-transform:uppercase;font-family:var(--mono)}
.sec-h::before{content:'';width:4px;height:14px;background:var(--crimson);border-radius:1px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--border)}
/* tool info */
.tool-info{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;margin-bottom:18px;position:relative}
.tool-info::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan);border-radius:var(--r-md) 0 0 var(--r-md)}
.ti-purpose{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:14px;font-weight:500}
.ti-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:12px}
.ti-block{min-width:0}
.ti-label{font-size:9.5px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;font-weight:700;margin-bottom:8px}
.ti-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ti-list li{font-size:12px;color:var(--text-2);line-height:1.5;padding-left:14px;position:relative}
.ti-list li::before{content:'>';position:absolute;left:0;color:var(--cyan);font-weight:700}
.ti-flags{display:flex;flex-direction:column;gap:5px}
.ti-flag{display:flex;align-items:baseline;gap:10px;font-size:11.5px}
.ti-flag code{font-family:var(--mono);background:var(--bg-2);color:var(--cyan);padding:1px 7px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:11px;flex-shrink:0;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.ti-flag span{color:var(--text-2);line-height:1.5}
.ti-callout{display:flex;gap:10px;font-size:12px;line-height:1.6;color:var(--text-2);margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-2)}
.ti-callout.ti-opsec{border-color:rgba(245,158,11,.25)}
.ti-callout.ti-gotcha{border-color:rgba(220,38,38,.25)}
.ti-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;font-weight:700;padding:2px 7px;border-radius:var(--r-sm);flex-shrink:0;align-self:flex-start;margin-top:1px}
.ti-opsec .ti-badge{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.ti-gotcha .ti-badge{background:rgba(220,38,38,.1);color:var(--crimson);border:1px solid rgba(220,38,38,.3)}
/* ===== PLAYBOOK ===== */
.pb-intro{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;font-size:13px;line-height:1.6;color:var(--text-2)}
.pb-intro b{color:var(--red)}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pb-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;cursor:pointer;transition:all .2s;position:relative}

.pb-card-desc{font-family:var(--mono);font-size:11px;color:var(--text-dim);line-height:1.5}

.pb-step-t{flex:1}
.pb-step-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}

.pb-run:hover .pb-run-copy{opacity:1}
.pb-run-copy:hover{color:var(--cyan);border-color:var(--cyan-dim)}
.pb-signal{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:7px 10px;border-radius:var(--r-sm);margin-top:6px}

.pb-signal.win b{color:var(--green)}
.pb-signal.fail b{color:var(--red)}
.pb-jump{display:inline-block;color:var(--cyan);border-bottom:1px dotted var(--cyan-dim);cursor:pointer;font-weight:600}

.sess-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

.pal-prompt{color:var(--cyan);font-weight:700;font-family:var(--mono)}
.pal-in input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--ui);font-size:15px;outline:none}

.pal-results{max-height:56vh;overflow-y:auto}

.pal-empty{padding:32px;text-align:center;color:var(--text-muted);font-size:12px}
.pal-foot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid var(--border);font-size:10px;color:var(--text-muted)}

.toast.show{transform:translateY(0);opacity:1}
.mobile-btn{display:none;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);width:38px;height:38px;padding:0;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mobile-btn:active{transform:scale(.94)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(5,5,5,.7);backdrop-filter:blur(4px);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s}

.drawer-close::before{content:'x  ';color:var(--cyan);font-size:16px}

const KW_RE=new RegExp('\\b('+KW.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','g');
function hl(code){
  let out=esc(code);const T=[];const push=h=>{T.push(h);return '\x01'+(T.length-1)+'\x01';};
  out=out.replace(/(^|\n)(#[^\n]*)/g,(_,p,c)=>p+push('<span class="cmt">'+c+'</span>'));
  out=out.replace(/&lt;([A-Z_][A-Z0-9_]*)&gt;/g,(_,k)=>{const v=STATE.vars[k];return push('<span class="var" data-var="'+k+'">'+(v?esc(v):'&lt;'+k+'&gt;')+'</span>');});
  out=out.replace(/&quot;((?:\\&quot;|[^&]|&(?!quot;))*?)&quot;/g,(_,s)=>push('<span class="str">&quot;'+s+'&quot;</span>'));
  out=out.replace(/&#39;((?:\\&#39;|[^&]|&(?!#39;))*?)&#39;/g,(_,s)=>push('<span class="str">&#39;'+s+'&#39;</span>'));
  out=out.replace(/\b(\d{2,})\b/g,(_,n)=>push('<span class="num">'+n+'</span>'));
  out=out.replace(KW_RE,m=>push('<span class="kw">'+m+'</span>'));
  while(/\x01\d+\x01/.test(out))out=out.replace(/\x01(\d+)\x01/g,(_,i)=>T[+i]);
  return out;
}
function resolve(code){return code.replace(/<([A-Z_][A-Z0-9_]*)>/g,(m,k)=>STATE.vars[k]||m);}

  h+='<div class="ws-head"><div class="ws-title"><div class="ws-title-icon">'+p.icon+'</div><div><div class="ws-title-text">'+p.name+'</div><div class="ws-count">'+p.port+' · '+esc(p.desc)+'</div></div></div></div>';
  h+='<div class="pb-detail">';
  p.steps.forEach(s=>{
    h+='<div class="pb-step"><div class="pb-step-head"><div class="pb-step-n">'+s.n+'</div><div class="pb-step-t"><div class="pb-step-title">'+esc(s.title)+'</div><div class="pb-step-goal">'+esc(s.goal)+'</div></div></div><div class="pb-step-body">';
    h+='<div class="pb-run"><button class="pb-run-copy" data-copy="'+esc(s.run)+'">Copy</button>'+hl(s.run)+'</div>';
    h+='<div class="pb-signal win"><b>✓ WIN &rarr;</b><span>'+esc(s.win)+'</span></div>';
    h+='<div class="pb-signal fail"><b>✗ MOVE ON &rarr;</b><span>'+esc(s.fail)+'</span></div>';
    h+='</div></div>';
  });
  h+='</div>';return h;
}
function wirePlaybookActions(){
  $$('.cs-copy').forEach(b=>{if(b._w)return;b._w=1;b.addEventListener('click',e=>{e.stopPropagation();navigator.clipboard.writeText(resolve(b.dataset.cmd)).then(()=>{b.textContent='\u2713 Copied';b.classList.add('done');showToast('Copied resolved command');setTimeout(()=>{b.textContent='Copy';b.classList.remove('done');},1400);});});});
  $$('[data-go]').forEach(el=>{if(el._wired)return;el._wired=1;el.addEventListener('click',()=>go(el.dataset.go));});
  $$('.pb-run-copy').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();navigator.clipboard.writeText(resolve(b.dataset.copy)).then(()=>{b.textContent='✓';showToast('Copied resolved command');setTimeout(()=>b.textContent='Copy',1200);});}));
}
/* ---- Session Notes ---- */
function renderSession(){
  const svc=STATE.activeSvc;
  const items=CHECKLISTS[svc]||[];
  const svcChips=(typeof CHECKLIST_ORDER!=='undefined'?CHECKLIST_ORDER:Object.keys(CHECKLIST_LABELS)).filter(k=>CHECKLISTS[k]).map(k=>'<span class="svc-chip '+(k===svc?'active':'')+'" data-svc="'+k+'">'+CHECKLIST_LABELS[k]+'</span>').join('');
  const checkHtml=items.map((txt,i)=>{
    const id=svc+'::'+i;const done=STATE.checks[id];
    return '<div class="chk-item '+(done?'done':'')+'" data-chk="'+id+'"><div class="chk-box">'+(done?'✓':'')+'</div><div class="chk-text">'+txt+'</div></div>';
  }).join('');
  const findHtml=STATE.findings.length?STATE.findings.map((f,i)=>'<div class="find-item"><span class="find-kind '+f.kind+'">'+f.kind+'</span><span class="find-val">'+esc(f.val)+'</span><span class="find-del" data-del="'+i+'">&times;</span></div>').join(''):'<div style="color:var(--text-muted);font-family:var(--mono);font-size:12px;padding:8px 0">No findings yet. Log creds, hosts, hashes, and flags as you go.</div>';
  return '\
  <div class="ws-head"><div class="ws-title"><div class="ws-title-icon">📓</div><div><div class="ws-title-text">Session Notes</div><div class="ws-count">everything for one engagement — saved in your browser</div></div></div></div>\
  <div class="sess-bar">\
    <input class="sess-input wide" id="sess-target" placeholder="Target name / IP (e.g. Odyssey 10.0.19.2)" value="'+esc(STATE.target)+'" />\
    <button class="mini-btn" id="sess-export">Export .md</button>\
    <button class="mini-btn" id="sess-clear">Clear session</button>\
  </div>\
  <div class="sess-grid">\
    <div>\
      <div class="sess-panel"><div class="sess-panel-h"><span>Live notes</span><span style="color:var(--text-muted);font-weight:400">autosaved</span></div><div class="sess-panel-b"><textarea class="sess-notes" id="sess-notes" placeholder="Paste nmap output, creds, weird behavior, next steps...\n\nWhat worked:\nWhat failed:\nTODO next:">'+esc(STATE.notes)+'</textarea></div></div>\
    </div>\
    <div>\
      <div class="sess-panel"><div class="sess-panel-h"><span>Findings</span><span style="color:var(--text-muted);font-weight:400">'+STATE.findings.length+'</span></div><div class="sess-panel-b">\
        <div class="find-row"><select id="find-kind"><option value="cred">cred</option><option value="host">host</option><option value="hash">hash</option><option value="flag">flag</option><option value="note">note</option></select><input id="find-val" placeholder="e.g. ghill_sa : (ssh key)" /><button id="find-add">Add</button></div>\
        <div class="find-list" id="find-list">'+findHtml+'</div>\
      </div></div>\
      <div class="sess-panel" style="margin-top:16px"><div class="sess-panel-h"><span>Checklist — check &amp; move on</span></div><div class="sess-panel-b">\
        <div class="sess-svc-pick">'+svcChips+'</div>\
        <div id="chk-list">'+checkHtml+'</div>\
      </div></div>\
    </div>\
  </div>';
}
function wireSession(){
  const t=$('#sess-target');if(t)t.addEventListener('input',e=>{STATE.target=e.target.value;save();syncTopbar();});
  const n=$('#sess-notes');if(n)n.addEventListener('input',e=>{STATE.notes=e.target.value;save();});
  const add=$('#find-add');if(add)add.addEventListener('click',()=>{
    const kind=$('#find-kind').value;const val=$('#find-val').value.trim();if(!val)return;
    STATE.findings.push({kind,val});save();syncTopbar();renderView();
  });
  const fv=$('#find-val');if(fv)fv.addEventListener('keydown',e=>{if(e.key==='Enter')$('#find-add').click();});
  $$('[data-del]').forEach(el=>el.addEventListener('click',()=>{STATE.findings.splice(+el.dataset.del,1);save();syncTopbar();renderView();}));
  $$('[data-chk]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.chk;STATE.checks[id]=!STATE.checks[id];save();renderView();}));
  $$('[data-svc]').forEach(el=>el.addEventListener('click',()=>{STATE.activeSvc=el.dataset.svc;renderView();}));
  const ex=$('#sess-export');if(ex)ex.addEventListener('click',exportSession);
  const cl=$('#sess-clear');if(cl)cl.addEventListener('click',()=>{if(confirm('Clear notes, findings, and checklist for this session? (Variables kept.)')){STATE.notes='';STATE.findings=[];STATE.checks={};STATE.target='';save();syncTopbar();renderView();showToast('Session cleared');}});
}
function exportSession(){
  let md='# PT Session — '+(STATE.target||STATE.vars.RHOST||'target')+'\n\n';
  md+='- RHOST: '+(STATE.vars.RHOST||'')+'\n- LHOST: '+(STATE.vars.LHOST||'')+'\n- Domain: '+(STATE.vars.DOMAIN||'')+'\n\n';
  md+='## Findings\n\n';
  if(STATE.findings.length)STATE.findings.forEach(f=>{md+='- **'+f.kind+'**: '+f.val+'\n';});else md+='_none_\n';
  md+='\n## Notes\n\n'+(STATE.notes||'_empty_')+'\n\n';
  md+='## Checklist progress\n\n';
  (typeof CHECKLIST_ORDER!=='undefined'?CHECKLIST_ORDER:Object.keys(CHECKLIST_LABELS)).filter(k=>CHECKLISTS[k]).forEach(svc=>{
    md+='### '+CHECKLIST_LABELS[svc]+'\n';
    (CHECKLISTS[svc]||[]).forEach((txt,i)=>{const done=STATE.checks[svc+'::'+i];md+='- ['+(done?'x':' ')+'] '+txt.replace(/<[^>]+>/g,'')+'\n';});
    md+='\n';
  });
  const blob=new Blob([md],{type:'text/markdown'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(STATE.target||'session').replace(/[^a-z0-9]+/gi,'_')+'.md';a.click();
  URL.revokeObjectURL(url);showToast('Exported markdown');
}

/* ---- Guide / Info ---- */
function renderInfo(){
  return '<div class="ws-head"><div class="ws-title"><div class="ws-title-icon">ⓘ</div><div><div class="ws-title-text">Guide &amp; Legal</div><div class="ws-count">how to drive CYPHRX in a real session</div></div></div></div>\
  <div class="pb-intro"><b>Order of operations, every box:</b><br>1. Set <b>RHOST</b> + <b>LHOST</b> in the Variables panel.<br>2. Open <b>Playbooks &rarr; Master Flow</b> and follow the steps top to bottom.<br>3. Jump into a service playbook (Web / SMB / AD) when you know what you are facing.<br>4. Log every cred, host, and hash in <b>Session Notes &rarr; Findings</b>, and tick the checklist so you never forget an enum step.<br>5. Export the session to markdown when you are done — that is your writeup skeleton.</div>\
  <div class="pb-intro"><b>The one rule that saves you:</b> if a path gives nothing after ~15 minutes, use the red <span style="color:var(--red)">MOVE ON</span> signal and try the next service. Tunnel-vision is the #1 time sink in PT.</div>\
  <div class="pb-intro"><b>Keyboard:</b> <span class="kbd">Ctrl K</span> command palette (jump to any playbook / tool / command). <span class="kbd">/</span> also opens it. <span class="kbd">Esc</span> closes.</div>\
  <div class="pb-intro"><b>Privacy:</b> single HTML file, no server, no telemetry. Everything (variables, notes, findings, checklist) lives in your browser localStorage on this device only.</div>\
  <div class="pb-intro" style="border-left-color:var(--amber)"><b style="color:var(--amber)">Authorized use only.</b> Run these techniques only against systems you own or are explicitly authorized to test — your lab, HTB / THM / PG, or scoped engagements. Unauthorized access is a crime.</div>';
}

/* ==================== CARD ACTIONS ==================== */
function wireCardActions(){
  $$('.copy-btn').forEach(btn=>{if(btn._w)return;btn._w=1;btn.addEventListener('click',e=>{
    e.stopPropagation();const card=btn.closest('.cmd');const[cat,i]=card.dataset.id.split('::');
    navigator.clipboard.writeText(resolve(CMD[cat][+i].c)).then(()=>{btn.textContent='✓ Copied';btn.classList.add('done');showToast('Copied resolved command');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done');},1400);});
  });});
  $$('.check-btn').forEach(btn=>{if(btn._w)return;btn._w=1;btn.addEventListener('click',e=>{
    e.stopPropagation();const card=btn.closest('.cmd');const id=card.dataset.id;
    if(STATE.done.has(id)){STATE.done.delete(id);card.classList.remove('checked');btn.textContent='Mark';btn.classList.remove('done');}
    else{STATE.done.add(id);card.classList.add('checked');btn.textContent='✓ Done';btn.classList.add('done');}
    save();
  });});
  $$('.tile[data-go]').forEach(el=>{if(el._w)return;el._w=1;el.addEventListener('click',()=>go(el.dataset.go));});
}

/* ==================== NAVIGATE ==================== */
function go(view){STATE.view=view;renderNav();renderView();window.scrollTo(0,0);if(window.closeDrawers)window.closeDrawers();}

/* ==================== PALETTE ==================== */
function buildPal(){
  const idx=[];
  idx.push({type:'Go',name:'Dashboard',cat:'◆ home',view:'dash'});
  idx.push({type:'Go',name:'Playbooks',cat:'🧭 attack flows',view:'playbooks'});
  idx.push({type:'Go',name:'Session Notes',cat:'📓 notes + findings',view:'session'});
  idx.push({type:'Go',name:'Cheatsheet',cat:'⚡ fast lookup',view:'cheatsheet'});
  CHEATSHEET.forEach(g=>g.items.forEach(it=>idx.push({type:'Cheatsheet',name:it[0],cat:'⚡ '+g.group,view:'cheatsheet'})));
  PLAYBOOKS.forEach(p=>idx.push({type:'Playbook',name:p.name,cat:p.icon+' '+p.port,view:p.id}));
  Object.entries(CATS).forEach(([k,c])=>idx.push({type:'Category',name:c.name,cat:c.icon+' '+c.desc,view:k}));
  Object.entries(CMD).forEach(([k,list])=>list.forEach((cmd,i)=>idx.push({type:'Command',name:cmd.t,cat:CATS[k].icon+' '+CATS[k].name,view:k,idx:i,code:cmd.c})));
  return idx;
}
let PAL=buildPal(),palCur=0,palF=PAL;
function palScore(it,q){const t=(it.name+' '+it.cat+' '+(it.code||'')).toLowerCase();if(!q)return 1;if(t.includes(q))return 100-t.indexOf(q);let i=0,s=0;for(const c of t){if(c===q[i]){s++;i++;if(i===q.length)return s;}}return 0;}
function renderPal(q){
  q=q.toLowerCase().trim();
  palF=PAL.map(it=>({it,s:palScore(it,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it).slice(0,50);
  if(!palF.length){$('#pal-results').innerHTML='<div class="pal-empty">no matches for "'+esc(q)+'"</div>';return;}
  palCur=Math.min(palCur,palF.length-1);
  const groups={};palF.forEach(i=>{(groups[i.type]=groups[i.type]||[]).push(i);});
  let h='',idx=0;
  Object.entries(groups).forEach(([t,items])=>{h+='<div class="pal-sec">'+t+'</div>';items.forEach(i=>{h+='<div class="pal-item '+(idx===palCur?'active':'')+'" data-idx="'+idx+'"><div class="pal-item-i">'+(i.type==='Command'?'▸':'→')+'</div><div><div class="pal-item-name">'+esc(i.name)+'</div><div class="pal-item-cat">'+esc(i.cat)+'</div></div></div>';idx++;});});
  $('#pal-results').innerHTML=h;
  $$('.pal-item').forEach(el=>{el.addEventListener('mouseenter',()=>{palCur=+el.dataset.idx;updPal();});el.addEventListener('click',()=>actPal(palF[+el.dataset.idx]));});
}
function actPal(it){if(!it)return;closePal();go(it.view);if(it.type==='Command')setTimeout(()=>{const card=$$('.cmd')[it.idx];if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.style.borderColor='var(--cyan)';setTimeout(()=>card.style.borderColor='',1600);}},80);}
function updPal(){$$('.pal-item').forEach((el,i)=>{el.classList.toggle('active',i===palCur);if(i===palCur)el.scrollIntoView({block:'nearest'});});}
function openPal(){$('#pal-bg').classList.add('open');$('#pal-input').value='';palCur=0;renderPal('');setTimeout(()=>$('#pal-input').focus(),30);}
function closePal(){$('#pal-bg').classList.remove('open');}

let toastT;function showToast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);}

/* ==================== BOOT ==================== */
window.addEventListener('DOMContentLoaded',()=>{
  renderNav();renderVars();renderView();syncTopbar();
  $('#brand').addEventListener('click',()=>go('dash'));
  $('#open-pal').addEventListener('click',openPal);
  $('#pal-bg').addEventListener('click',e=>{if(e.target.id==='pal-bg')closePal();});
  $('#pal-input').addEventListener('input',e=>renderPal(e.target.value));
  $('#pal-input').addEventListener('keydown',e=>{
    if(e.key==='Escape')closePal();
    if(e.key==='ArrowDown'){e.preventDefault();palCur=Math.min(palCur+1,palF.length-1);updPal();}
    if(e.key==='ArrowUp'){e.preventDefault();palCur=Math.max(palCur-1,0);updPal();}
    if(e.key==='Enter'){e.preventDefault();actPal(palF[palCur]);}
  });
  const sidebar=$('.sidebar'),vars=$('.vars'),bg=$('#drawer-bg');
  function openDrawer(w){closeDrawers();if(w==='sidebar')sidebar.classList.add('open');if(w==='vars')vars.classList.add('open');bg.classList.add('open');document.body.style.overflow='hidden';}
  function closeDrawers(){sidebar.classList.remove('open');vars.classList.remove('open');bg.classList.remove('open');document.body.style.overflow='';}
  window.closeDrawers=closeDrawers;
  $('#menu-toggle')&&$('#menu-toggle').addEventListener('click',()=>openDrawer('sidebar'));
  $('#vars-toggle')&&$('#vars-toggle').addEventListener('click',()=>openDrawer('vars'));
  $('#search-toggle')&&$('#search-toggle').addEventListener('click',openPal);
  bg.addEventListener('click',closeDrawers);
  $$('.drawer-close').forEach(b=>b.addEventListener('click',closeDrawers));
  $('#reset-prog').addEventListener('click',()=>{if(confirm('Reset marked-command progress? (Notes & findings kept.)')){STATE.done=new Set();save();renderView();showToast('Progress reset');}});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#pal-bg').classList.contains('open')?closePal():openPal();}
    if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();openPal();}
  });
});
</script>
